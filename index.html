<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRShare - P2P File Transfer</title>
    <meta name="theme-color" content="#e5e7eb" />
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="description" content="Envía un archivo de un dispositivo a otro escaneando un código QR. Viaja directo entre los dos, sin subirse a ningún servidor." />
  <link rel="canonical" href="https://qrshare.dotrino.com/" />
  <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
  <meta property="og:site_name" content="Dotrino" />
  <meta property="og:title" content="QRShare" />
  <meta property="og:description" content="Transferencia de archivos P2P por WebRTC. Comparte por QR." />
  <meta property="og:url" content="https://qrshare.dotrino.com/" />
  <meta property="og:image" content="https://qrshare.dotrino.com/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="QRShare" />
  <meta name="twitter:description" content="Transferencia de archivos P2P por WebRTC. Comparte por QR." />
  <meta name="twitter:image" content="https://qrshare.dotrino.com/og.jpg" />
  <link rel="stylesheet" href="styles.css">
  <!-- Barra superior estándar del ecosistema (@dotrino/topbar, CONVENCIONES §5/§6.1).
       OJO: por CDN va SIEMPRE con +esm, no con /src/index.js (sus imports desnudos
       no resuelven en el navegador). Trae dentro <dotrino-back>, <dotrino-support>,
       toggle de idioma y botón de perfil. -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@dotrino/topbar@0.5/+esm"></script>
  <!-- Analítica cookieless autohosteada (GoatCounter); no cuenta en localhost/LAN. -->
  <script>window.goatcounter={path:function(p){return location.hostname+p}}</script>
  <script data-goatcounter="https://goat.dotrino.com/count" async src="https://goat.dotrino.com/count.js"></script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "QRShare",
      "url": "https://qrshare.dotrino.com/",
      "description": "Transferencia de archivos P2P por WebRTC. Comparte por QR.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Web",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "publisher": { "@type": "Organization", "name": "Dotrino", "url": "https://dotrino.com/" }
    }
    </script>
  <!-- PWA (CONVENCIONES §3): manifiesto, tema e iconos de pantalla de inicio. -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="QRShare" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
</head>
<body>
  <dotrino-topbar brand="QRShare" icon="./icon.svg"
    support-repo="imdotrino/dotrino-qrshare"
    support-discord="https://discord.gg/D648uq7cth"
    profile no-lang></dotrino-topbar>
  <main id="main">
    <div id="app"></div>
  </main>

  <!-- QR Code library -->
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>
  <!-- App. Es un MÓDULO porque importa el pilar del transporte
       (@dotrino/proxy-client) y el sellado de @dotrino/identity desde jsDelivr,
       siempre por `+esm` (los imports desnudos no resuelven en el navegador). -->
  <script type="module" src="app.js"></script>
  <script>
    // Registro del service worker (§3): la app queda disponible sin conexión.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {})
      })
    }
  </script>
</body>
</html>
